name: Loop Crypto
description: >-
  Loop Crypto is a crypto and stablecoin payment processor that lets merchants, billing
  software, and e-commerce platforms accept crypto and stablecoin payments end to end:
  charging a wallet, storing payment methods, accepting stablecoins, ERC-20 tokens, and
  Solana SPL tokens, and settling to merchants in either fiat or crypto. Loop offers payment
  links, an embeddable Pay/PayIn checkout component, a white-labelable Connect widget, and a
  REST API (v1/v2, api-key + entity-id header auth) covering customers, entities, merchants,
  tokens, payments, payouts, and webhooks, plus out-of-the-box integrations with Stripe,
  Chargebee, and OpenPay. Backed by a16z. NOTE: Loop is winding down and folding into Lead;
  the service was sunset on 2026-02-13 and is not recommended for new integrations.
